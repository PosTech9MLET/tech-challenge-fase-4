name: OpenWiki Pages

# Publica o visualizer estático do OpenWiki no GitHub Pages.
# Pré-requisito: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openwiki-pages
  cancel-in-progress: false

jobs:
  build:
    name: Exportar visualizer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.7.2

      - name: Export static visualizer
        run: openwiki visualize openwiki --export _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
