name: OpenWiki Pages

# Publica o visualizer estático do OpenWiki no GitHub Pages.
# O Pages tem um único site por repositório e cada deploy o substitui por inteiro,
# então todo deploy monta as duas versões juntas:
#   main        -> /
#   development -> /development/
# Pré-requisitos:
#   - Settings → Pages → Source: GitHub Actions
#   - Settings → Environments → github-pages: permitir deploy das branches main e development

on:
  push:
    branches: [main, development]
    paths:
      - "openwiki/**"
      - ".github/workflows/openwiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openwiki-pages
  cancel-in-progress: false

jobs:
  build:
    name: Exportar visualizer (main + development)
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: src-main

      - name: Check out development
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: development
          path: src-development

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.7.2

      - name: Export static visualizers
        run: |
          mkdir -p _site
          if [ -d src-development/openwiki ]; then
            openwiki visualize src-development/openwiki --export _site/development
          else
            echo "::warning title=OpenWiki Pages::development ainda não tem openwiki/"
          fi
          if [ -d src-main/openwiki ]; then
            openwiki visualize src-main/openwiki --export _site/main-export
            # Move o export da main para a raiz sem sobrescrever _site/development.
            cp -r _site/main-export/. _site/
            rm -rf _site/main-export
          else
            echo "::warning title=OpenWiki Pages::main ainda não tem openwiki/"
            if [ -d _site/development ]; then
              printf '%s\n' '<!doctype html><meta charset="utf-8">' \
                '<meta http-equiv="refresh" content="0; url=./development/">' \
                '<a href="./development/">OpenWiki (development)</a>' > _site/index.html
            fi
          fi
          if [ -z "$(ls -A _site)" ]; then
            echo "::error title=OpenWiki Pages::Nenhuma branch tem openwiki/ para publicar"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
