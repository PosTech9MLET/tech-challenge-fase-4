[project]
name = "tech-challenge-fase-4"
version = "0.1.0"
description = "Tech Challenge - Fase 4 (FIAP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23",
    "joblib>=1.6.0",
    "mlflow>=3.18.0",
    "pandas>=2.3,<3",
    "pandera[pandas]>=0.35.0",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.1",
    "scikit-learn>=1.9.1",
    "setuptools<81",
    "xgboost>=3.4.1",
    "ydata-profiling>=4.18.4",
]


# ---------------- Ruff (lint + format) ----------------
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks/"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D", "B", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: testes demorados",
    "integration: testes de integração",
]

# ---------------- Coverage ----------------
[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 0  # suba para 70+ quando houver código de verdade

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.9",
    "xenon>=0.9.3",
]
